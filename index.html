<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FATE8192">
<title>FATE / 8192</title>
<style>
:root{
  --red:#d84a42;
  --green:#2aaa64;
  --gold:#d9b568;
  --ink:#f7f3e8;
  --muted:#c9c6bd;
  --panel:rgba(8,10,13,.72);
  --stage-dark:0;
  --skyTop:#91c5ef;
  --skyBottom:#f4d9a8;
  --sunOpacity:1;
  --lantern:0;
  --shrineScale:.88;
  --mist:.03;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608;color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Yu Gothic",sans-serif}
button{font:inherit}
button:focus{outline:none}
.screen{position:absolute;inset:0}
.hidden{display:none!important}

#gameScreen{background:#0c1115;overflow:hidden}
.scene{
  position:absolute;inset:0;
  background:linear-gradient(var(--skyTop),var(--skyBottom));
  transition:background 1s ease,filter 1s ease;
  overflow:hidden;
}
.sun{
  position:absolute;width:105px;height:105px;border-radius:50%;
  top:8%;right:13%;background:radial-gradient(circle,#fff9d1 0 18%,#ffd884 35%,rgba(255,213,120,.25) 65%,transparent 70%);
  opacity:var(--sunOpacity);filter:blur(.2px);transition:opacity 1s;
}
.clouds{position:absolute;inset:0;opacity:.35;background:
 radial-gradient(ellipse at 20% 17%,rgba(255,255,255,.9) 0 7%,transparent 8%),
 radial-gradient(ellipse at 27% 16%,rgba(255,255,255,.8) 0 6%,transparent 7%),
 radial-gradient(ellipse at 69% 23%,rgba(255,255,255,.55) 0 8%,transparent 9%);
}
.mountains{
 position:absolute;left:-10%;right:-10%;bottom:35%;height:36%;
 background:
 linear-gradient(145deg,transparent 0 31%,rgba(44,68,62,.72) 32% 52%,transparent 53%),
 linear-gradient(215deg,transparent 0 34%,rgba(36,58,54,.82) 35% 55%,transparent 56%),
 linear-gradient(155deg,transparent 0 43%,rgba(29,48,45,.95) 44% 68%,transparent 69%);
 filter:brightness(calc(1 - var(--stage-dark)*.5));
}
.trees{
 position:absolute;left:0;right:0;bottom:18%;height:47%;
 background:
 radial-gradient(circle at 8% 65%,#1d3b24 0 12%,transparent 13%),
 radial-gradient(circle at 16% 46%,#27532f 0 13%,transparent 14%),
 radial-gradient(circle at 91% 62%,#18351f 0 14%,transparent 15%),
 radial-gradient(circle at 84% 43%,#244b2c 0 12%,transparent 13%);
 filter:brightness(calc(1 - var(--stage-dark)*.6));
}
.ground{
 position:absolute;left:-8%;right:-8%;bottom:-5%;height:48%;
 background:linear-gradient(#50633b,#28352b 36%,#131a18 100%);
 filter:brightness(calc(1 - var(--stage-dark)*.6));
}
.path{
 position:absolute;left:50%;bottom:-4%;width:42%;height:56%;
 transform:translateX(-50%);
 clip-path:polygon(37% 0,63% 0,100% 100%,0 100%);
 background:
 repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 2px,transparent 2px 39px),
 linear-gradient(90deg,#5b5b52,#8c897b 50%,#54554d);
 filter:brightness(calc(1 - var(--stage-dark)*.45));
 box-shadow:0 0 25px rgba(0,0,0,.25);
}
.shrine{
 position:absolute;left:50%;top:16%;width:52%;height:34%;
 transform:translateX(-50%) scale(var(--shrineScale));
 transform-origin:center bottom;transition:transform 1s ease,filter 1s ease;
 filter:brightness(calc(1 - var(--stage-dark)*.5));
}
.roof{
 position:absolute;left:8%;right:8%;top:0;height:23%;
 background:#20211f;clip-path:polygon(8% 70%,24% 26%,76% 26%,92% 70%,100% 78%,78% 71%,22% 71%,0 78%);
 box-shadow:0 5px 10px rgba(0,0,0,.35);
}
.mainhall{
 position:absolute;left:20%;right:20%;top:18%;bottom:0;
 background:linear-gradient(90deg,#4b231a,#7b3523 20% 80%,#4b231a);
 border:5px solid #241b17;
}
.mainhall:before{content:"";position:absolute;left:42%;right:42%;top:0;bottom:0;background:#1b1714}
.torii{
 position:absolute;left:50%;top:24%;width:44%;height:31%;transform:translateX(-50%);
 transition:filter 1s;
 filter:brightness(calc(1 - var(--stage-dark)*.45));
}
.torii .beam1,.torii .beam2{position:absolute;left:0;right:0;background:#8f341f;border-radius:2px}
.torii .beam1{top:3%;height:8%;transform:scaleX(1.08)}
.torii .beam2{top:15%;height:6%;left:7%;right:7%}
.torii .post{position:absolute;top:10%;bottom:0;width:7%;background:#8c321f}
.torii .post.l{left:18%}.torii .post.r{right:18%}
.lanterns{position:absolute;inset:0;opacity:var(--lantern);transition:opacity 1s}
.lamp{position:absolute;width:10px;height:17px;background:#ffd17b;border:2px solid #3a2a1c;box-shadow:0 0 18px #ffbd57}
.lamp:nth-child(1){left:25%;top:54%}.lamp:nth-child(2){right:25%;top:54%}
.lamp:nth-child(3){left:18%;top:63%}.lamp:nth-child(4){right:18%;top:63%}
.lamp:nth-child(5){left:11%;top:74%}.lamp:nth-child(6){right:11%;top:74%}
.mist{position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(215,225,225,var(--mist)) 65%,transparent);pointer-events:none}
.darkOverlay{position:absolute;inset:0;background:rgba(4,7,12,var(--stage-dark));transition:background 1s;pointer-events:none}

.topbar{
 position:absolute;z-index:20;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 9px) 14px 8px;
 display:flex;justify-content:space-between;align-items:center;
 background:linear-gradient(rgba(0,0,0,.52),transparent);
}
.brand{font-weight:900;letter-spacing:.14em;font-size:14px}
.topBtns{display:flex;gap:8px}
.round{
 width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.23);
 color:#fff;background:rgba(5,7,9,.46);font-weight:900
}
.infoBox{
 position:absolute;z-index:18;top:calc(env(safe-area-inset-top) + 61px);
 background:var(--panel);border:1px solid rgba(217,181,104,.55);border-radius:12px;
 backdrop-filter:blur(8px);padding:9px 11px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.22)
}
.prob{left:10px;min-width:108px}
.statsMini{right:10px;min-width:104px}
.infoBox .label{font-size:9px;color:#ddd8ca}
.prob .big{font-size:27px;font-weight:900;color:#f4cf85;margin-top:2px}
.statsMini b{font-size:15px;color:#f3d38f}
.statsMini div{font-size:9px;line-height:1.7}

.scroll{
 position:absolute;z-index:18;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%);
 width:86px;height:285px;background:linear-gradient(90deg,#c7ae7a,#e8d7aa 18% 82%,#b79867);
 color:#2c2419;border-radius:3px;box-shadow:0 10px 35px rgba(0,0,0,.4);padding:18px 13px 12px;
}
.scroll:before,.scroll:after{content:"";position:absolute;left:-7px;right:-7px;height:11px;border-radius:6px;background:#4f3822}
.scroll:before{top:-6px}.scroll:after{bottom:-6px}
.scrollTitle{font-size:10px;font-weight:900;text-align:center;margin-bottom:7px}
.history{display:flex;flex-direction:column;align-items:center;gap:3px;height:225px;overflow:hidden}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.35);box-shadow:inset 0 1px 1px rgba(255,255,255,.45)}
.dot.red{background:var(--red)}.dot.green{background:var(--green)}
.dot.fail{box-shadow:0 0 0 2px #282018 inset;opacity:.72}
.empty{font-size:11px;color:#77664f;margin-top:45px;text-align:center}

.gate{
 position:absolute;z-index:15;bottom:25%;width:31%;height:29%;border:0;color:#fff;border-radius:9px 9px 3px 3px;
 box-shadow:0 14px 30px rgba(0,0,0,.35);overflow:hidden;transition:transform .2s,filter .2s,opacity .2s
}
.gate:before{content:"";position:absolute;inset:8px;border:2px solid rgba(255,255,255,.18);border-bottom:0;border-radius:7px}
.gate.red{right:6%;background:linear-gradient(#b63c34,#681b1d)}
.gate.green{left:6%;background:linear-gradient(#309e58,#15582f)}
.gate .kanji{font-size:44px;font-weight:900;position:absolute;left:0;right:0;top:31%;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.gate .sub{position:absolute;left:0;right:0;bottom:17%;text-align:center;font-size:12px;font-weight:700}
.gate.correct{animation:correct .55s ease}
.gate.wrong{animation:wrong .42s ease}
@keyframes correct{40%{filter:brightness(1.8);box-shadow:0 0 38px currentColor}100%{filter:brightness(1.15)}}
@keyframes wrong{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}100%{filter:grayscale(.6) brightness(.55)}}

.playerWrap{
 position:absolute;z-index:17;left:50%;bottom:11%;width:44px;height:76px;transform:translateX(-50%);
 transition:left .52s cubic-bezier(.22,.8,.3,1),bottom .52s cubic-bezier(.22,.8,.3,1),transform .52s;
}
.playerWrap.toLeft{left:21%;bottom:32%;transform:translateX(-50%) scale(.6)}
.playerWrap.toRight{left:79%;bottom:32%;transform:translateX(-50%) scale(.6)}
.player{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:29px;height:61px}
.head{position:absolute;left:7px;top:0;width:15px;height:15px;background:#d7c0ac;border-radius:50%;box-shadow:0 0 0 3px #15171a}
.body{position:absolute;left:5px;top:16px;width:19px;height:27px;background:linear-gradient(#323843,#20242c);border-radius:7px}
.leg{position:absolute;top:39px;width:7px;height:19px;background:#171b21;border-radius:4px}.leg.l{left:6px}.leg.r{right:6px}
.shadow{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:42px;height:8px;background:rgba(0,0,0,.38);border-radius:50%;filter:blur(2px)}
.running .player{animation:run .16s alternate infinite}
@keyframes run{to{transform:translateX(-50%) translateY(-3px) rotate(3deg)}}

.prompt{
 position:absolute;z-index:16;left:50%;bottom:6%;transform:translateX(-50%);
 width:min(78%,420px);background:rgba(5,7,9,.72);border:1px solid rgba(255,255,255,.13);
 border-radius:14px;padding:8px 12px;text-align:center;font-size:13px;backdrop-filter:blur(7px);pointer-events:none
}
.prompt span{color:#bcb8ae;font-size:10px;display:block;margin-top:2px}
.toast{
 position:absolute;z-index:40;left:50%;top:54%;transform:translate(-50%,-50%) scale(.9);
 background:rgba(5,6,8,.88);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:14px 20px;
 text-align:center;opacity:0;pointer-events:none;transition:.18s;min-width:190px
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast b{font-size:23px}.toast small{display:block;margin-top:4px;color:#cbc9c1}

#statsScreen{background:#0b0f13;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:34px}
.statsHeader{position:sticky;top:0;z-index:10;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;background:rgba(9,12,16,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between}
.statsHeader h1{font-size:18px;margin:0}
.backBtn{border:1px solid rgba(255,255,255,.16);background:#171b20;color:#fff;border-radius:10px;padding:8px 12px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px}
.sum{background:#13181e;border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:12px 6px;text-align:center}
.sum b{font-size:22px;color:#f0cb81}.sum span{display:block;font-size:9px;color:#aeb3ba;margin-top:3px}
.tableWrap{margin:0 12px;background:#11161b;border:1px solid rgba(217,181,104,.35);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:9px 5px;border-bottom:1px solid rgba(255,255,255,.07);text-align:right}
th{background:#1b2229;color:#ddd7cb;font-size:9px}
th:first-child,td:first-child{text-align:center}
td:nth-child(2){color:#f0cf8c}
.rateBar{height:7px;background:#252c32;border-radius:8px;overflow:hidden;margin-top:4px}
.rateFill{height:100%;background:linear-gradient(90deg,#286e46,#4cbd78);min-width:0}
.note{padding:10px 16px 20px;font-size:10px;line-height:1.6;color:#969ca4}
.soundList{margin:14px 12px 0;background:#11161b;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px}
.soundList h2{font-size:14px;margin:0 0 8px}
.soundRow{display:flex;justify-content:space-between;gap:10px;border-top:1px solid rgba(255,255,255,.07);padding:8px 0;font-size:10px;color:#b8bdc3}
.soundRow:first-of-type{border-top:0}
.soundRow b{color:#ece7dc;font-size:11px}
@media(max-height:720px){
 .scroll{height:240px}.history{height:180px}.gate{height:27%;bottom:24%}.prompt{display:none}
}
</style>
</head>
<body>
<div id="gameScreen" class="screen">
  <div class="scene" id="scene">
    <div class="sun"></div><div class="clouds"></div><div class="mountains"></div><div class="trees"></div>
    <div class="ground"></div><div class="path"></div>
    <div class="shrine"><div class="roof"></div><div class="mainhall"></div></div>
    <div class="torii"><div class="beam1"></div><div class="beam2"></div><div class="post l"></div><div class="post r"></div></div>
    <div class="lanterns"><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i></div>
    <div class="mist"></div><div class="darkOverlay"></div>
  </div>

  <div class="topbar">
    <div class="brand">FATE / 8192</div>
    <div class="topBtns">
      <button class="round" id="soundBtn" aria-label="サウンド">♪</button>
      <button class="round" id="statsBtn" aria-label="統計">▥</button>
    </div>
  </div>

  <div class="infoBox prob"><div class="label">現在の到達確率</div><div class="big" id="probText">1 / 2</div></div>
  <div class="infoBox statsMini">
    <div>挑戦 <b id="attemptMini">0</b></div>
    <div>最高 <b id="bestMini">0</b></div>
    <div>クリア <b id="clearMini">0</b></div>
  </div>

  <div class="scroll">
    <div class="scrollTitle">これまでの正解</div>
    <div class="history" id="history"></div>
    <div class="empty" id="emptyHistory">まだ記録なし</div>
  </div>

  <button class="gate green" id="greenGate"><div class="kanji">緑</div><div class="sub">左へ進む</div></button>
  <button class="gate red" id="redGate"><div class="kanji">赤</div><div class="sub">右へ進む</div></button>

  <div class="playerWrap" id="player"><div class="shadow"></div><div class="player"><div class="head"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div></div></div>

  <div class="prompt">進む道を選ぼう<span>緑の門か赤の門をタップ</span></div>
  <div class="toast" id="toast"><b id="toastBig"></b><small id="toastSmall"></small></div>
</div>

<div id="statsScreen" class="screen hidden">
  <div class="statsHeader"><button class="backBtn" id="backBtn">← 戻る</button><h1>到達確率と実到達率</h1><div style="width:58px"></div></div>
  <div class="summary">
    <div class="sum"><b id="sumAttempts">0</b><span>総挑戦回数</span></div>
    <div class="sum"><b id="sumBest">0</b><span>最高連続突破</span></div>
    <div class="sum"><b id="sumClears">0</b><span>クリア回数</span></div>
  </div>
  <div class="tableWrap">
    <table>
      <thead><tr><th>段階</th><th>理論到達</th><th>到達回数</th><th>実到達率</th></tr></thead>
      <tbody id="statsBody"></tbody>
    </table>
  </div>
  <div class="note">
    実到達率＝その段階まで到達した回数 ÷ 総挑戦回数です。理論上は各段階で半分ずつ減り、13回連続成功で1/8192になります。
  </div>
  <div class="soundList" id="soundList">
    <h2>ステージごとの環境音</h2>
  </div>
</div>

<script>
(()=>{
const MAX=13;
const stages=[
 {name:'朝の参道',sky1:'#95c9ef',sky2:'#f4daa6',dark:.02,sun:1,lantern:0,scale:.82,mist:.02,sound:'鳥のさえずり・木々の葉音',amb:'birds'},
 {name:'境内の朝',sky1:'#83b9e1',sky2:'#e9c98f',dark:.05,sun:.95,lantern:0,scale:.86,mist:.025,sound:'鳥の声・遠い鈴',amb:'bell'},
 {name:'木立の参道',sky1:'#6fa7ce',sky2:'#c9b77d',dark:.09,sun:.82,lantern:0,scale:.90,mist:.035,sound:'葉擦れ・鳥の声',amb:'wind'},
 {name:'午後の社',sky1:'#6094bd',sky2:'#c49b6c',dark:.14,sun:.70,lantern:.05,scale:.94,mist:.04,sound:'風・砂利を踏む気配',amb:'gravel'},
 {name:'夕方の参道',sky1:'#587ca0',sky2:'#b67759',dark:.20,sun:.55,lantern:.15,scale:.98,mist:.045,sound:'ひぐらし・木々の音',amb:'cicada'},
 {name:'薄暮の境内',sky1:'#445f7c',sky2:'#8b5e55',dark:.28,sun:.35,lantern:.30,scale:1.02,mist:.05,sound:'虫の声・遠い鈴',amb:'insects'},
 {name:'宵の大鳥居',sky1:'#34475e',sky2:'#584c55',dark:.36,sun:.15,lantern:.48,scale:1.06,mist:.06,sound:'夜風・鈴の余韻',amb:'nightwind'},
 {name:'夜の石段',sky1:'#263446',sky2:'#343844',dark:.43,sun:0,lantern:.62,scale:1.10,mist:.07,sound:'虫の声・風',amb:'insects'},
 {name:'深夜の境内',sky1:'#1f2b3a',sky2:'#292f38',dark:.49,sun:0,lantern:.74,scale:1.14,mist:.08,sound:'静かな風・梟',amb:'owl'},
 {name:'灯籠の参道',sky1:'#192534',sky2:'#242931',dark:.54,sun:0,lantern:.86,scale:1.18,mist:.09,sound:'風・灯籠の燃える音',amb:'fire'},
 {name:'奥宮への道',sky1:'#151f2c',sky2:'#1f242b',dark:.59,sun:0,lantern:.94,scale:1.22,mist:.10,sound:'木々のざわめき・低い鈴',amb:'deepbell'},
 {name:'奥宮の石段',sky1:'#111a25',sky2:'#191e24',dark:.64,sun:0,lantern:1,scale:1.27,mist:.11,sound:'風・かすかな虫の声',amb:'nightwind'},
 {name:'本殿前',sky1:'#0d151f',sky2:'#14191f',dark:.69,sun:0,lantern:1,scale:1.33,mist:.12,sound:'静寂・本殿の鈴',amb:'deepbell'}
];
const $=id=>document.getElementById(id);
const gameScreen=$('gameScreen'),statsScreen=$('statsScreen'),scene=$('scene'),historyEl=$('history'),emptyHistory=$('emptyHistory');
const greenGate=$('greenGate'),redGate=$('redGate'),player=$('player'),toast=$('toast'),toastBig=$('toastBig'),toastSmall=$('toastSmall');
let stage=1,locked=false,soundOn=true,audioCtx=null,ambientTimer=null,ambientNodes=[];
const mem={};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=String(v)}}};
let stats={attempts:0,best:0,clears:0,reach:Array(MAX).fill(0),history:[]};
try{stats={...stats,...JSON.parse(store.get('fate8192_v3')||'{}')}}catch(e){}
if(!Array.isArray(stats.reach)||stats.reach.length!==MAX)stats.reach=Array(MAX).fill(0);
if(!Array.isArray(stats.history))stats.history=[];
soundOn=store.get('fate8192_sound')!=='off';

function save(){store.set('fate8192_v3',JSON.stringify(stats))}
function randSide(){try{const a=new Uint32Array(1);crypto.getRandomValues(a);return(a[0]&1)?'green':'red'}catch(e){return Math.random()<.5?'green':'red'}}
function vibrate(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function setLocked(v){locked=v;greenGate.disabled=v;redGate.disabled=v}

function applyStage(){
 const s=stages[stage-1],r=document.documentElement.style;
 r.setProperty('--skyTop',s.sky1);r.setProperty('--skyBottom',s.sky2);r.setProperty('--stage-dark',s.dark);
 r.setProperty('--sunOpacity',s.sun);r.setProperty('--lantern',s.lantern);r.setProperty('--shrineScale',s.scale);r.setProperty('--mist',s.mist);
 $('probText').textContent='1 / '+(2**stage).toLocaleString();
 restartAmbient();
}
function render(){
 $('attemptMini').textContent=stats.attempts;$('bestMini').textContent=stats.best;$('clearMini').textContent=stats.clears;
 historyEl.innerHTML='';
 stats.history.slice(-13).forEach(x=>{const d=document.createElement('div');d.className='dot '+x;historyEl.appendChild(d)});
 emptyHistory.style.display=stats.history.length?'none':'block';
 $('soundBtn').textContent=soundOn?'♪':'×';
 applyStage();
}
function showToast(big,small,ms=620){
 toastBig.textContent=big;toastSmall.textContent=small;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),ms)
}
function resetVisual(){player.className='playerWrap';greenGate.classList.remove('correct','wrong');redGate.classList.remove('correct','wrong')}
function ensureAudio(){if(!soundOn)return null;try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}
function beep(freq=600,d=.08,type='sine',gain=.025){const c=ensureAudio();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.type=type;g.gain.value=gain;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.stop(c.currentTime+d)}
function clearAmbient(){if(ambientTimer){clearInterval(ambientTimer);ambientTimer=null}ambientNodes.forEach(n=>{try{n.stop&&n.stop()}catch(e){};try{n.disconnect&&n.disconnect()}catch(e){}});ambientNodes=[]}
function noiseBurst(gain=.008,d=.15){
 const c=ensureAudio();if(!c)return;const len=Math.floor(c.sampleRate*d),buf=c.createBuffer(1,len,c.sampleRate),data=buf.getChannelData(0);
 for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
 const src=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();src.buffer=buf;f.type='bandpass';f.frequency.value=2200;f.Q.value=.7;g.gain.value=gain;
 src.connect(f);f.connect(g);g.connect(c.destination);src.start();ambientNodes.push(src)
}
function restartAmbient(){
 clearAmbient();if(!soundOn)return;const type=stages[stage-1].amb;
 const fire=()=>{if(type==='birds'){beep(1700+Math.random()*700,.05,'sine',.008);setTimeout(()=>beep(2100+Math.random()*500,.04,'sine',.006),90)}
 else if(type==='bell'){if(Math.random()<.35)beep(650,.55,'sine',.012);else noiseBurst(.004,.2)}
 else if(type==='wind'||type==='nightwind'){noiseBurst(type==='nightwind'?.005:.007,.35)}
 else if(type==='gravel'){noiseBurst(.008,.08)}
 else if(type==='cicada'||type==='insects'){beep(type==='cicada'?4100:3300,.05,'square',.003)}
 else if(type==='owl'){if(Math.random()<.28){beep(430,.28,'sine',.008);setTimeout(()=>beep(360,.34,'sine',.006),210)}}
 else if(type==='fire'){noiseBurst(.006,.06)}
 else if(type==='deepbell'){if(Math.random()<.28)beep(260,.9,'sine',.012);else noiseBurst(.003,.25)}};
 ambientTimer=setInterval(fire, type==='insects'||type==='cicada'?650:1200+Math.random()*900);
}
function choose(side){
 if(locked)return;ensureAudio();setLocked(true);resetVisual();
 const answer=randSide();player.classList.add('running',side==='green'?'toLeft':'toRight');beep(230,.06,'square',.012);
 setTimeout(()=>{
  player.classList.remove('running');const chosen=side==='green'?greenGate:redGate,correct=answer==='green'?greenGate:redGate;
  if(side===answer){
    chosen.classList.add('correct');stats.history.push(answer);if(stats.history.length>13)stats.history=stats.history.slice(-13);
    stats.best=Math.max(stats.best,stage);stats.reach[stage-1]++;save();render();vibrate(24);beep(660,.08);setTimeout(()=>beep(880,.1),80);
    showToast('SUCCESS',`${stages[stage-1].name} 突破`);
    if(stage===MAX){stats.attempts++;stats.clears++;save();setTimeout(()=>{showToast('1 / 8192 CLEAR','最初の参道へ戻ります',1200);setTimeout(()=>autoReset(),1350)},620)}
    else{stage++;setTimeout(()=>{resetVisual();render();setLocked(false)},720)}
  }else{
    chosen.classList.add('wrong');correct.classList.add('correct');stats.attempts++;save();render();vibrate([70,45,120]);beep(120,.28,'sawtooth',.035);
    showToast('FAILED',`正解は${answer==='green'?'緑':'赤'}　1 / 2へ戻ります`,1000);
    setTimeout(()=>autoReset(),1150)
  }
 },520)
}
function autoReset(){stage=1;resetVisual();render();setLocked(false)}
function openStats(){
 clearAmbient();gameScreen.classList.add('hidden');statsScreen.classList.remove('hidden');
 $('sumAttempts').textContent=stats.attempts;$('sumBest').textContent=stats.best;$('sumClears').textContent=stats.clears;
 const tb=$('statsBody');tb.innerHTML='';
 for(let i=0;i<MAX;i++){
  const theoretical=1/(2**(i+1));const actual=stats.attempts?stats.reach[i]/stats.attempts:0;
  const tr=document.createElement('tr');
  tr.innerHTML=`<td>${i+1}</td><td>1 / ${(2**(i+1)).toLocaleString()}</td><td>${stats.reach[i]}</td><td>${(actual*100).toFixed(3)}%<div class="rateBar"><div class="rateFill" style="width:${Math.min(100,actual*100)}%"></div></div></td>`;
  tb.appendChild(tr);
 }
 const list=$('soundList');list.innerHTML='<h2>ステージごとの環境音</h2>';
 stages.forEach((s,i)=>{const d=document.createElement('div');d.className='soundRow';d.innerHTML=`<b>${i+1}. ${s.name}</b><span>${s.sound}</span>`;list.appendChild(d)});
}
function closeStats(){statsScreen.classList.add('hidden');gameScreen.classList.remove('hidden');render()}
greenGate.addEventListener('click',()=>choose('green'));redGate.addEventListener('click',()=>choose('red'));
$('statsBtn').addEventListener('click',openStats);$('backBtn').addEventListener('click',closeStats);
$('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;store.set('fate8192_sound',soundOn?'on':'off');if(!soundOn)clearAmbient();render();if(soundOn)beep(700,.06)});
render();
})();
</script>
</body>
</html>
