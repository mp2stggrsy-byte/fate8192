<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#06090c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./assets/icons/icon-192.png"><link rel="stylesheet" href="./styles.css?v=10"><title>FATE / 8192</title></head><body>
<section id="game" class="view active"><div id="bg" class="bg"></div><div class="cinema"></div><header><div><h1>FATE / 8192</h1><small id="stageName"></small></div><nav><button id="sound">♪</button><button id="stats">▦</button></nav></header><div class="prob panel"><span>現在の到達確率</span><strong id="prob">1 / 2</strong><em id="pct">50.000%</em></div><div class="mini panel"><div>挑戦<b id="att">0</b></div><div>最高<b id="best">0</b></div><div>クリア<b id="clear">0</b></div></div><div class="scroll"><i></i><div class="paper"><b>これまでの正解</b><div id="history"></div></div><i></i></div><button class="hit green" id="green" aria-label="緑"></button><button class="hit red" id="red" aria-label="赤"></button><div class="caption">進む道を選べ<small><mark>緑</mark>の門か <mark class="r">赤</mark>の門をタップ</small></div><div id="toast" class="toast"><b id="toastB"></b><span id="toastS"></span></div><div id="flash" class="flash"></div><audio id="ambient" loop preload="auto"></audio></section>
